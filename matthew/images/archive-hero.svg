<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Photo &amp; Video Archive Toolkit — date-sorted, hash-verified, searchable">
  <defs>
    <linearGradient id="ar-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16201e"/>
      <stop offset="0.6" stop-color="#1e2c33"/>
      <stop offset="1" stop-color="#2a2540"/>
    </linearGradient>
    <radialGradient id="ar-glow" cx="0.8" cy="0.28" r="0.65">
      <stop offset="0" stop-color="#F85D00" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#F85D00" stop-opacity="0"/>
    </radialGradient>
    <style>
      .ey{font-family:'Helvetica Neue',Arial,sans-serif;font-size:30px;letter-spacing:7px;fill:#7fd1c0;font-weight:700;}
      .ti{font-family:'Helvetica Neue',Arial,sans-serif;font-size:118px;fill:#F6F0E0;font-weight:800;letter-spacing:-2px;}
      .su{font-family:'Helvetica Neue',Arial,sans-serif;font-size:40px;fill:#dfe9e6;font-weight:400;}
      .ch{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:28px;fill:#F6F0E0;font-weight:500;}
      .lb{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:24px;fill:#0f1714;font-weight:700;}
    </style>
  </defs>
  <rect width="1200" height="900" fill="url(#ar-bg)"/>
  <rect width="1200" height="900" fill="url(#ar-glow)"/>
  <!-- stacked, date-sorted photo cards (top-right motif) -->
  <g transform="translate(760,150)">
    <g transform="rotate(-9)">
      <rect x="40" y="40" width="300" height="210" rx="14" fill="#ffffff" opacity="0.10"/>
    </g>
    <g transform="rotate(-3)">
      <rect x="20" y="20" width="300" height="210" rx="14" fill="#ffffff" opacity="0.16"/>
    </g>
    <rect x="0" y="0" width="300" height="210" rx="14" fill="#F6F0E0"/>
    <rect x="0" y="0" width="300" height="150" rx="14" fill="#7fd1c0"/>
    <rect x="0" y="120" width="300" height="40" fill="#7fd1c0"/>
    <circle cx="78" cy="62" r="26" fill="#F6F0E0" opacity="0.85"/>
    <path d="M0 150 L92 96 L150 132 L214 80 L300 138 L300 150 Z" fill="#2a2540" opacity="0.55"/>
    <text x="150" y="190" text-anchor="middle" class="lb">2026-06-05</text>
    <!-- verified check -->
    <g transform="translate(264,176)">
      <circle cx="0" cy="0" r="26" fill="#F85D00"/>
      <path d="M-11 0 l7 8 l15 -17" fill="none" stroke="#F6F0E0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text class="ey" x="110" y="300">MEDIA PIPELINE &#183; SQLITE CATALOG</text>
  <text class="ti" x="104" y="420">archive</text>
  <text class="su" x="110" y="486">90,484 files — sorted, hashed, searchable</text>
  <!-- chips -->
  <g>
    <rect x="110" y="552" width="244" height="58" rx="8" fill="#ffffff" opacity="0.10"/>
    <text class="ch" x="134" y="590">Hash-verified</text>
    <rect x="376" y="552" width="226" height="58" rx="8" fill="#ffffff" opacity="0.10"/>
    <text class="ch" x="400" y="590">Date-sorted</text>
    <rect x="624" y="552" width="258" height="58" rx="8" fill="#ffffff" opacity="0.10"/>
    <text class="ch" x="648" y="590">SQL-queryable</text>
  </g>
  <rect x="0" y="884" width="1200" height="16" fill="#F85D00"/>
</svg>
