<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="GyattChores — gamified family chore tracker">
  <defs>
    <linearGradient id="gc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2f63"/>
      <stop offset="0.55" stop-color="#3b3f7d"/>
      <stop offset="1" stop-color="#46568c"/>
    </linearGradient>
    <radialGradient id="gc-glow" cx="0.78" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#D0A500" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#D0A500" stop-opacity="0"/>
    </radialGradient>
    <style>
      .ey{font-family:'Helvetica Neue',Arial,sans-serif;font-size:30px;letter-spacing:8px;fill:#cbd2ff;font-weight:700;}
      .ti{font-family:'Helvetica Neue',Arial,sans-serif;font-size:128px;fill:#F6F0E0;font-weight:800;letter-spacing:-1px;}
      .su{font-family:'Helvetica Neue',Arial,sans-serif;font-size:42px;fill:#e7e9ff;font-weight:400;}
      .ch{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:30px;fill:#F6F0E0;font-weight:500;}
    </style>
  </defs>
  <rect width="1200" height="900" fill="url(#gc-bg)"/>
  <rect width="1200" height="900" fill="url(#gc-glow)"/>
  <!-- faint dotted grid -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="120" cy="170" r="4"/><circle cx="220" cy="170" r="4"/><circle cx="320" cy="170" r="4"/>
    <circle cx="120" cy="270" r="4"/><circle cx="220" cy="270" r="4"/><circle cx="320" cy="270" r="4"/>
  </g>
  <!-- trophy mark -->
  <g transform="translate(905,300)" opacity="0.95">
    <path d="M55 0 H145 V40 Q200 40 200 95 Q200 160 140 170 V200 H160 V230 H40 V200 H60 V170 Q0 160 0 95 Q0 40 55 40 Z" fill="#D0A500"/>
    <rect x="60" y="230" width="80" height="22" rx="4" fill="#D0A500"/>
    <text x="100" y="135" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="86" font-weight="800" fill="#2a2f63">G</text>
  </g>
  <text class="ey" x="110" y="318">WEB APP &#183; PWA</text>
  <text class="ti" x="104" y="440">GyattChores</text>
  <text class="su" x="110" y="500">Gamified family chore tracker</text>
  <!-- chips -->
  <g>
    <rect x="110" y="560" width="250" height="58" rx="8" fill="#ffffff" opacity="0.10"/>
    <text class="ch" x="135" y="598">250 pts = $1</text>
    <rect x="382" y="560" width="220" height="58" rx="8" fill="#ffffff" opacity="0.10"/>
    <text class="ch" x="407" y="598">Leaderboard</text>
    <rect x="624" y="560" width="170" height="58" rx="8" fill="#ffffff" opacity="0.10"/>
    <text class="ch" x="649" y="598">Streaks</text>
  </g>
  <rect x="0" y="884" width="1200" height="16" fill="#D0A500"/>
</svg>
