<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Recuter — apply at the speed of the bots">
  <defs>
    <linearGradient id="rc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#11141a"/>
    </linearGradient>
    <radialGradient id="rc-glow" cx="0.82" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#5cf2a3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5cf2a3" stop-opacity="0"/>
    </radialGradient>
    <style>
      .ey{font-family:Inter,ui-sans-serif,system-ui,'Helvetica Neue',Arial,sans-serif;font-size:28px;letter-spacing:8px;fill:#5cf2a3;font-weight:700;}
      .ti{font-family:Inter,ui-sans-serif,system-ui,'Helvetica Neue',Arial,sans-serif;font-size:150px;fill:#e8ecf1;font-weight:800;letter-spacing:-4px;}
      .su{font-family:Inter,ui-sans-serif,system-ui,'Helvetica Neue',Arial,sans-serif;font-size:44px;fill:#e8ecf1;font-weight:600;}
      .mu{font-family:Inter,ui-sans-serif,system-ui,'Helvetica Neue',Arial,sans-serif;font-size:30px;fill:#8a93a0;font-weight:400;}
      .ch{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:26px;fill:#e8ecf1;font-weight:500;}
      .st{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:24px;fill:#5cf2a3;font-weight:600;letter-spacing:2px;}
    </style>
  </defs>
  <rect width="1200" height="900" fill="url(#rc-bg)"/>
  <rect width="1200" height="900" fill="url(#rc-glow)"/>

  <!-- status pill: building -->
  <g transform="translate(110,118)">
    <rect x="0" y="0" width="210" height="52" rx="26" fill="#5cf2a3" opacity="0.10"/>
    <circle cx="34" cy="26" r="9" fill="#5cf2a3"/>
    <text class="st" x="58" y="35">BUILDING</text>
  </g>

  <!-- speed lines -->
  <g stroke="#5cf2a3" stroke-width="6" stroke-linecap="round" opacity="0.55">
    <line x1="780" y1="250" x2="1090" y2="250"/>
    <line x1="720" y1="306" x2="1050" y2="306"/>
    <line x1="820" y1="362" x2="1110" y2="362"/>
  </g>

  <!-- Apply button with cursor -->
  <g transform="translate(826,432)">
    <rect x="0" y="0" width="284" height="94" rx="12" fill="#5cf2a3"/>
    <text x="142" y="62" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="700" fill="#0b0d10">Apply</text>
    <path d="M254 98 l42 16 l-16 6 l12 28 l-13 6 l-12 -28 l-16 12 Z" fill="#e8ecf1" stroke="#0b0d10" stroke-width="3"/>
  </g>

  <text class="ey" x="112" y="318">AI AGENT &#183; GIS JOBS</text>
  <text class="ti" x="104" y="452">recuter</text>
  <text class="su" x="112" y="520">Apply at the speed of the bots.</text>
  <text class="mu" x="112" y="566">First-in-line before the listing caps out.</text>

  <!-- feature pills -->
  <g>
    <rect x="112" y="618" width="172" height="56" rx="8" fill="#ffffff" opacity="0.06"/>
    <text class="ch" x="134" y="654">GIS-first</text>
    <rect x="300" y="618" width="312" height="56" rx="8" fill="#ffffff" opacity="0.06"/>
    <text class="ch" x="322" y="654">Tailored applications</text>
    <rect x="112" y="690" width="338" height="56" rx="8" fill="#ffffff" opacity="0.06"/>
    <text class="ch" x="134" y="726">First-in-line submission</text>
    <rect x="466" y="690" width="296" height="56" rx="8" fill="#ffffff" opacity="0.06"/>
    <text class="ch" x="488" y="726">Human-in-the-loop</text>
  </g>

  <rect x="0" y="884" width="1200" height="16" fill="#5cf2a3"/>
</svg>
